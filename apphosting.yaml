# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # NOTE: Most environment variables are now in apphosting.dev.yaml and apphosting.prd.yaml
  # to support multi-environment deployment.

  # Shared Non-Sensitive Variables
  - variable: POSTMARK_FROM_ADDRESS
    value: crew@teampulp.com
    availability: [BUILD, RUNTIME]

  # Shared Secrets (Must exist in both projects with these names)
  # See docs/environment_setup.md for provisioning instructions.
  - variable: AUTH_SECRET
    secret: secretAuthSecret
  - variable: TWILIO_API_KEY
    secret: secretTwilioApiKey
  - variable: TWILIO_API_SECRET
    secret: secretTwilioApiSecret    
  - variable: TWILIO_ACCOUNT_SID
    secret: secretTwilioAccountSid
  - variable: TWILIO_AUTH_TOKEN
    secret: secretTwilioAuthToken
  - variable: POSTMARK_SERVER_API_TOKEN
    secret: secretPostmarkServerApiToken
  - variable: STRIPE_SECRET_KEY
    secret: secretStripeSecretKey
  - variable: STRIPE_WEBHOOK_SECRET
    secret: secretStripeWebhookSecret
  - variable: GOOGLE_RECAPTCHA_V3_SECRET_KEY
    secret: secretGoogleRecaptchaV3SecretKey
