name: Deploy Firebase Rules & Indexes

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-rules.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_DEV }}
        run: |
          firebase deploy --only firestore,storage --project dev --token "$FIREBASE_TOKEN"

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRD }}
        run: |
          firebase deploy --only firestore,storage --project prd --token "$FIREBASE_TOKEN"
